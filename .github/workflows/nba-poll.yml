name: NBA score poll

# Each run stays alive (up to ~5.5h) and checks every game about one average
# game length after tip-off, posting final scores. If a check is still coming
# up when time runs out, the run starts a fresh run to take over. The cron
# times below are just starting points / backups (GitHub may run them late).
on:
  schedule:
    - cron: "0 15 * * *" # 10-11am ET: posts the day's schedule
    - cron: "0 21 * * *"
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: nba-score-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: write
      actions: write
    steps:
      # Check out the branch tip (not the trigger commit) so a queued run
      # always starts from the latest saved bot_state.json.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Watch games
        timeout-minutes: 340
        env:
          TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: python nba_score_bot.py

      # Save state even if the watch errored part-way, so posted alerts
      # are never re-sent on the next run.
      - name: Save bot state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot_state.json
          if git diff --staged --quiet; then
            echo "No state changes"
          else
            git commit -m "chore: update bot state"
            git pull --rebase
            git push
          fi

      - name: Hand off to a fresh run
        if: always() && hashFiles('.redispatch') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run nba-poll.yml --ref "${{ github.event.repository.default_branch }}"
